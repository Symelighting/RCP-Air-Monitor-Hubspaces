<!DOCTYPE html>
<!--
  Royal College of Physicians - Outside meeting rooms, Level 10
  The Spine, Paddington Village.

  LEGACY BUILD, written for the Onelan / Reserva NTB player (NTB 11.x, WebKit 531).
  That browser is Safari 4 era, so this file deliberately avoids everything it
  cannot parse or paint:
    - no fetch, no Promise, no async/await   (XMLHttpRequest with callbacks)
    - no arrow functions, let/const, template literals, classes  (plain ES3)
    - no Map, Object.entries, Array.find/includes  (small polyfills below)
    - no CSS variables, flexbox or grid       (absolute positioning in pixels)
    - no inline SVG                           (the trend chart is built from divs)
    - no web fonts                            (falls back to the player's own fonts)

  Designed for a fixed 800 x 1280 portrait panel.

  If the panel still cannot reach Airthings directly, its browser is probably
  blocking the cross-origin request or cannot negotiate TLS to the API. Set
  DATA_URL below to the address of rcp-airthings-monitor.php on your own server
  and this page will read from that instead, which removes both problems.

  Note: the API client id and secret are in plain text below. Anyone who can open
  or view-source this file can read the estate's sensor data.
-->

<script type="text/javascript">
/* =========================================================================
 * CONFIGURATION
 * ====================================================================== */
var CLIENT_ID     = "d5b3d738-f09c-4f89-8939-ab595b334cf0";
var CLIENT_SECRET = "9f705a28-a3a9-4c64-b6a2-eec50f22a3db";

/* The sensor this screen shows, and how it is labelled. */
var SERIAL    = "2969002772";          /* Outside meeting rooms */
var ROOM_NAME = "Outside meeting rooms";
var FLOOR     = "Level 10";

/* Fallback for players that cannot call the Airthings API directly.
   Point this at rcp-airthings-monitor.php on your own server, for example
   "http://spine-server/airthings/rcp-airthings-monitor.php", and the page will
   read from there instead. Serve this file from the same server to avoid
   cross-origin requests altogether. Leave blank to talk to Airthings direct. */
var DATA_URL = "";

var REFRESH_MS   = 300000;   /* five minutes */
var REQUEST_MS   = 20000;    /* give up on a request after twenty seconds */
var RELOAD_HOURS = 6;

/* =========================================================================
 * POLYFILLS - WebKit 531 predates most of ES5
 * ====================================================================== */
if (!Array.prototype.indexOf) {
  Array.prototype.indexOf = function (item) {
    for (var i = 0; i < this.length; i++) { if (this[i] === item) { return i; } }
    return -1;
  };
}
if (!Array.prototype.forEach) {
  Array.prototype.forEach = function (fn) {
    for (var i = 0; i < this.length; i++) { fn(this[i], i, this); }
  };
}
if (!Object.keys) {
  Object.keys = function (obj) {
    var out = [], k;
    for (k in obj) { if (Object.prototype.hasOwnProperty.call(obj, k)) { out.push(k); } }
    return out;
  };
}
if (!Date.now) { Date.now = function () { return new Date().getTime(); }; }

/* =========================================================================
 * METRICS
 * bands: lower is better. window: middle is best. up: higher is better.
 * ====================================================================== */
var METRICS = [
  { k: "co2",      label: "CO2",         unit: "ppm",   dp: 0, bands: [800, 1000] },
  { k: "temp",     label: "TEMPERATURE", unit: "&deg;C", dp: 1, window: [18, 25, 16, 27] },
  { k: "humidity", label: "HUMIDITY",    unit: "%",     dp: 0, window: [30, 60, 25, 70] },
  { k: "voc",      label: "VOC",         unit: "ppb",   dp: 0, bands: [250, 2000] },
  { k: "pm25",     label: "PM2.5",       unit: "&micro;g/m&sup3;", dp: 1, bands: [10, 25] },
  { k: "pm1",      label: "PM1",         unit: "&micro;g/m&sup3;", dp: 1, bands: [10, 25] },
  { k: "pm10",     label: "PM10",        unit: "&micro;g/m&sup3;", dp: 1, bands: [25, 50] },
  { k: "sla",      label: "SOUND LEVEL", unit: "dBA",   dp: 0 },
  { k: "virusRisk", label: "VIRUS RISK", unit: "",      dp: 0, bands: [30, 60] },
  { k: "airExchangeRate", label: "AIR EXCHANGE", unit: "ACH", dp: 2 },
  { k: "pressure", label: "PRESSURE",    unit: "hPa",   dp: 0 },
  { k: "light",    label: "LIGHT LEVEL", unit: "",      dp: 0 },
  { k: "battery",  label: "BATTERY",     unit: "%",     dp: 0, up: [20, 10] }
];
var HERO_KEY = "co2";
/* Which metrics fill the six tiles, in order of preference. */
var TILE_KEYS = ["temp", "humidity", "voc", "pm25", "pm1", "pm10", "sla", "virusRisk",
                 "airExchangeRate", "pressure", "light", "battery"];

function metricFor(key) {
  for (var i = 0; i < METRICS.length; i++) { if (METRICS[i].k === key) { return METRICS[i]; } }
  return null;
}

function statusOf(key, value) {
  var m = metricFor(key);
  if (!m || value === null || value === undefined) { return ""; }
  var v = Number(value);
  if (isNaN(v)) { return ""; }
  if (m.bands) { return v <= m.bands[0] ? "good" : (v <= m.bands[1] ? "fair" : "poor"); }
  if (m.window) {
    if (v >= m.window[0] && v <= m.window[1]) { return "good"; }
    if (v >= m.window[2] && v <= m.window[3]) { return "fair"; }
    return "poor";
  }
  if (m.up) { return v >= m.up[0] ? "good" : (v >= m.up[1] ? "fair" : "poor"); }
  return "";
}

function worstOf(data) {
  var order = { "": 0, good: 1, fair: 2, poor: 3 };
  var worst = "";
  for (var i = 0; i < METRICS.length; i++) {
    var k = METRICS[i].k;
    if (k === "battery") { continue; }
    var s = statusOf(k, data[k]);
    if (order[s] > order[worst]) { worst = s; }
  }
  return worst;
}

function fmt(value, m) {
  if (value === null || value === undefined || value === "") { return "\u2013"; }
  var v = Number(value);
  if (isNaN(v)) { return "\u2013"; }
  var dp = m ? m.dp : 1;
  if (v.toFixed) { return v.toFixed(dp); }
  return "" + v;
}

function ago(seconds) {
  if (seconds === null) { return "no reading"; }
  if (seconds < 90) { return "just now"; }
  if (seconds < 3600) { return Math.round(seconds / 60) + " min ago"; }
  if (seconds < 86400) { return Math.round(seconds / 3600) + " h ago"; }
  return Math.round(seconds / 86400) + " d ago";
}

function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function byId(id) { return document.getElementById(id); }

/* =========================================================================
 * REQUESTS - XMLHttpRequest with callbacks, plus our own timeout
 * ====================================================================== */
function request(method, url, body, auth, done) {
  var xhr = new XMLHttpRequest();
  var finished = false;

  var timer = setTimeout(function () {
    if (finished) { return; }
    finished = true;
    try { xhr.abort(); } catch (e) {}
    done("The request timed out", null);
  }, REQUEST_MS);

  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4 || finished) { return; }
    finished = true;
    clearTimeout(timer);
    if (xhr.status < 200 || xhr.status >= 300) {
      done("HTTP " + (xhr.status || "0, no response") + " from " + url, null);
      return;
    }
    var parsed;
    try { parsed = eval("(" + xhr.responseText + ")"); }
    catch (e) { done("The response was not readable JSON", null); return; }
    done(null, parsed);
  };

  try {
    xhr.open(method, url, true);
    if (body) { xhr.setRequestHeader("Content-Type", "application/json"); }
    if (auth) { xhr.setRequestHeader("Authorization", "Bearer " + auth); }
    xhr.send(body ? body : null);
  } catch (e) {
    if (!finished) {
      finished = true;
      clearTimeout(timer);
      done("The browser refused the request: " + e, null);
    }
  }
}

var token = null;
var tokenExpires = 0;

function withToken(done) {
  if (token && tokenExpires > Date.now() + 60000) { done(null, token); return; }
  var body = '{"grant_type":"client_credentials","client_id":"' + CLIENT_ID +
    '","client_secret":"' + CLIENT_SECRET + '","scope":["read:device"]}';
  request("POST", "https://accounts-api.airthings.com/v1/token", body, null, function (err, data) {
    if (err) { done("Sign in failed. " + err, null); return; }
    if (!data || !data.access_token) { done("Sign in returned no token", null); return; }
    token = data.access_token;
    tokenExpires = Date.now() + (data.expires_in ? data.expires_in * 1000 : 3600000);
    done(null, token);
  });
}

/* Current reading, either straight from Airthings or via the PHP endpoint. */
function loadReading(done) {
  if (DATA_URL) {
    request("GET", DATA_URL + "?api=latest", null, null, function (err, payload) {
      if (err) { done(err, null); return; }
      if (!payload || !payload.rooms) { done("The server sent no readings", null); return; }
      for (var i = 0; i < payload.rooms.length; i++) {
        if (payload.rooms[i].serial === SERIAL) { done(null, payload.rooms[i].data); return; }
      }
      done("Sensor " + SERIAL + " was not in the server response", null);
    });
    return;
  }
  withToken(function (err, tok) {
    if (err) { done(err, null); return; }
    request("GET", "https://ext-api.airthings.com/v1/devices/" + SERIAL + "/latest-samples",
      null, tok, function (err2, payload) {
        if (err2) { done(err2, null); return; }
        done(null, payload && payload.data ? payload.data : null);
      });
  });
}

/* Twenty four hours of history for the big reading. */
function loadHistory(done) {
  var to = Math.floor(Date.now() / 1000);
  var from = to - 86400;
  if (DATA_URL) {
    request("GET", DATA_URL + "?api=history&serial=" + SERIAL + "&hours=24", null, null,
      function (err, payload) {
        if (err) { done(err, null); return; }
        done(null, payload && payload.data ? payload.data : null);
      });
    return;
  }
  withToken(function (err, tok) {
    if (err) { done(err, null); return; }
    request("GET", "https://ext-api.airthings.com/v1/devices/" + SERIAL +
      "/samples?start=" + from + "&end=" + to, null, tok, function (err2, payload) {
        if (err2) { done(err2, null); return; }
        done(null, payload && payload.data ? payload.data : null);
      });
  });
}

/* =========================================================================
 * PAINTING
 * ====================================================================== */
function showAlert(message) {
  var box = byId("alert");
  if (!message) { box.style.display = "none"; box.innerHTML = ""; return; }
  box.innerHTML = message;
  box.style.display = "block";
}

function paintReading(data) {
  var heroMetric = metricFor(HERO_KEY);
  var heroValue = data[HERO_KEY];
  var heroStatus = statusOf(HERO_KEY, heroValue);

  byId("heroValue").innerHTML = fmt(heroValue, heroMetric) +
    (heroMetric.unit ? ' <span class="u">' + heroMetric.unit + "</span>" : "");
  byId("heroValue").className = heroStatus;

  var age = data.time ? Math.floor(Date.now() / 1000) - data.time : null;
  var stale = (age === null || age > 1200);
  var worst = worstOf(data);
  var word = stale ? "No recent data"
    : (worst === "poor" ? "Action" : (worst === "fair" ? "Watch" : "Within guidance"));
  var tone = stale ? "dorm" : (worst === "poor" ? "poor" : (worst === "fair" ? "fair" : "good"));

  byId("stateWord").innerHTML = word;
  byId("stateWord").className = tone;
  byId("roomName").innerHTML = ROOM_NAME;
  byId("roomMeta").innerHTML = "Airthings " + SERIAL + " &middot; reading " + ago(age);
  byId("footRight").innerHTML = "Last reading " + ago(age);

  var shown = 0;
  for (var i = 0; i < TILE_KEYS.length && shown < 6; i++) {
    var key = TILE_KEYS[i];
    if (data[key] === null || data[key] === undefined) { continue; }
    var m = metricFor(key);
    var tile = byId("tile" + shown);
    tile.innerHTML = '<div class="tileLab">' + m.label + '</div>' +
      '<div class="tileVal ' + statusOf(key, data[key]) + '">' + fmt(data[key], m) +
      (m.unit ? ' <span class="tileUnit">' + m.unit + '</span>' : '') + '</div>';
    tile.style.display = "block";
    shown++;
  }
  for (var j = shown; j < 6; j++) { byId("tile" + j).style.display = "none"; }
}

/* The trend chart is a row of absolutely positioned divs, so no SVG is needed. */
function paintChart(history) {
  var chart = byId("chart");
  var stats = byId("heroStats");
  if (!history || !history[HERO_KEY]) {
    chart.innerHTML = "";
    stats.innerHTML = "History unavailable";
    return;
  }

  var raw = history[HERO_KEY];
  var points = [];
  for (var i = 0; i < raw.length; i++) {
    if (raw[i] === null || raw[i] === undefined) { continue; }
    points.push(Number(raw[i]));
  }
  if (!points.length) { chart.innerHTML = ""; stats.innerHTML = "No history yet"; return; }

  var low = points[0], high = points[0], total = 0;
  for (var p = 0; p < points.length; p++) {
    if (points[p] < low) { low = points[p]; }
    if (points[p] > high) { high = points[p]; }
    total += points[p];
  }
  var span = high - low;
  if (span < 1) { span = 1; }

  /* Fit the samples into 100 columns across the 700px chart. */
  var columns = 100;
  var step = points.length / columns;
  var html = "";
  for (var c = 0; c < columns; c++) {
    var start = Math.floor(c * step);
    var end = Math.floor((c + 1) * step);
    if (end <= start) { end = start + 1; }
    var sum = 0, count = 0;
    for (var s = start; s < end && s < points.length; s++) { sum += points[s]; count++; }
    if (!count) { continue; }
    var value = sum / count;
    var height = Math.round(((value - low) / span) * 140) + 4;
    var colour = statusOf(HERO_KEY, value);
    var hex = colour === "poor" ? "#ff9862" : (colour === "fair" ? "#ffcc53" : "#59d8a1");
    html += '<div class="bar" style="left:' + (c * 7) + 'px;height:' + height +
            'px;background:' + hex + ';"></div>';
  }
  chart.innerHTML = html;

  var m = metricFor(HERO_KEY);
  stats.innerHTML = "low " + fmt(low, m) + "&nbsp;&nbsp;high " + fmt(high, m) +
    "&nbsp;&nbsp;average " + fmt(total / points.length, m) +
    "&nbsp;&nbsp;" + points.length + " readings";
}

/* =========================================================================
 * RUNNING
 * ====================================================================== */
var failures = 0;
var lastReadingAt = 0;

function tickClock() {
  var now = new Date();
  byId("clock").innerHTML = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
  if (lastReadingAt) {
    byId("live").innerHTML = "Live from Airthings &middot; <b>" +
      ago(Math.floor((Date.now() - lastReadingAt) / 1000)) + "</b>";
  }
}

function refresh() {
  loadReading(function (err, data) {
    if (err || !data) {
      failures++;
      var wait = Math.min(120, 15 * failures);
      showAlert("No data from Airthings: " + (err || "empty response") +
        ". Retrying in " + wait + " seconds.");
      setTimeout(refresh, wait * 1000);
      return;
    }
    failures = 0;
    showAlert("");
    lastReadingAt = Date.now();
    paintReading(data);
    loadHistory(function (err2, history) {
      if (!err2) { paintChart(history); }
      else { byId("heroStats").innerHTML = "History unavailable"; }
    });
    setTimeout(refresh, REFRESH_MS);
  });
}

tickClock();
setInterval(tickClock, 1000);
refresh();

/* A screen left running for weeks benefits from an occasional clean start.
   The meta refresh in the head does the same job if scripting is interrupted. */
setTimeout(function () { window.location.reload(true); }, RELOAD_HOURS * 3600000);
</script>
</body>
</html>
